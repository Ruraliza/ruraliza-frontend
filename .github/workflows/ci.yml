# Verificações em cada PR e push: lint, autoteste das regras, tipos, testes e build.
# Só verifica: quem publica no GitHub Pages é o deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A mesma versão do deploy.yml.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify
