name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  # Publicar de novo sem um commit novo (Actions > Deploy Angular to GitHub Pages > Run workflow).
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Dois jobs, como no modelo oficial do GitHub Pages. Com o deploy no mesmo job do upload, a API às vezes
# ainda não lista o artefato recém-enviado ("No artifacts named github-pages"); e rodar de novo o job
# repete o upload e deixa dois artefatos com o mesmo nome. Em jobs separados, o deploy só começa depois
# que o build terminou, e "Re-run failed jobs" refaz apenas o deploy, com o mesmo artefato.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build de Produção do Angular
        run: npx ng build --configuration production --base-href /ruraliza-frontend/

      # Copia o index.html para 404.html para evitar erro 404 no F5 (SPA Fallback)
      - name: Configurar SPA Fallback (404.html)
        run: cp dist/ruraliza-frontend/browser/index.html dist/ruraliza-frontend/browser/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist/ruraliza-frontend/browser'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
