<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ruraliza — serviços no campo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ruraliza conecta produtores rurais a trabalhadores e prestadores de serviço no campo.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#00552A">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ruraliza">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // Tema e modo de leitura salvos neste aparelho (PreferencesService), aplicados antes do app carregar:
    // quem usa o tema escuro não vê a tela piscar em branco.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('ruraliza.preferences') || 'null');
        if (!p) return;
        var root = document.documentElement;
        var dark = p.theme === 'dark' || (p.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (p.text_size === 'large') root.setAttribute('data-text', 'large');
        if (p.high_contrast) root.setAttribute('data-contrast', 'high');
      } catch (e) {}
    })();
  </script>
  <style>
    /* Símbolo enquanto o app carrega (sinal fraco no campo). O Angular troca o conteúdo de <app-root> ao iniciar;
       só aparece depois de 0,4 s, para não piscar em conexão boa. */
    .boot { position: fixed; inset: 0; display: grid; place-items: center; animation: boot-in .3s .4s both; }
    @keyframes boot-in { from { opacity: 0; } }
  </style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
</head>
<body>
  <app-root><div class="boot"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40" width="60" height="80" role="img" aria-label="Ruraliza, carregando"><path d="M0 10A10 10 0 0 1 10 0H20V10H10V20H0Z" fill="#005320"/><path d="M20 0H30V10A10 10 0 0 1 20 20Z" fill="#017D08"/><path d="M10 20H20L30 30V40H20L10 30Z" fill="#89C401"/><path d="M0 30H10V40H0Z" fill="#FE8400"/></svg></div></app-root>
</body>
</html>
