<div class="form-container">
  <h2>Cadastro de Produtor Rural</h2>
  <p>Preencha os dados abaixo para acessar a plataforma Ruraliza.</p>

  <!-- Alertas de Sucesso e Erro -->
  <div *ngIf="successMessage" class="alert success">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert error">
    {{ errorMessage }}
  </div>

  <!-- Formulário Reativo -->
  <form [formGroup]="farmerForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="name">Nome Completo *</label>
      <input type="text" id="name" formControlName="name" placeholder="Ex: Carlos Aguiar">
    </div>

    <div class="form-group">
      <label for="email">E-mail *</label>
      <input type="email" id="email" formControlName="email" placeholder="carlos@exemplo.com">
    </div>

    <div class="form-group">
      <label for="phone">Telefone (WhatsApp) *</label>
      <input type="text" id="phone" formControlName="phone" placeholder="32999998888">
    </div>

    <div class="form-group">
      <label for="cpf">CPF *</label>
      <input type="text" id="cpf" formControlName="cpf" placeholder="Apenas números">
    </div>

    <div class="form-group">
      <label for="farms">Quantidade de Fazendas</label>
      <input type="number" id="farms" formControlName="farms" placeholder="Opcional">
    </div>

    <button type="submit" [disabled]="farmerForm.invalid">Cadastrar Produtor</button>
  </form>
</div>
