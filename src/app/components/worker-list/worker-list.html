<div class="list-container">
  <h2>Trabalhadores e Estudantes</h2>
  <p>Lista de perfis disponíveis para prestação de serviços.</p>

  <div *ngIf="errorMessage" class="alert error">
    {{ errorMessage }}
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Certificações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let worker of workers">
        <td>{{ worker.id }}</td>
        <td>{{ worker.name }}</td>
        <td>{{ worker.email }}</td>
        <td>{{ worker.phone }}</td>
        <td>{{ worker.certificates || 'Nenhuma' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="workers.length === 0 && !errorMessage" class="empty-state">
    Nenhum trabalhador registado no momento.
  </div>
</div>
