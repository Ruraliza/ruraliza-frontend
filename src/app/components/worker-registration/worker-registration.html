<div class="form-container">
  <h2>Cadastro de Trabalhador / Estudante</h2>
  <p>Crie o seu perfil para encontrar serviços e validar as suas horas.</p>

  <div *ngIf="successMessage" class="alert success">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert error">
    {{ errorMessage }}
  </div>

  <form [formGroup]="workerForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="name">Nome Completo *</label>
      <input type="text" id="name" formControlName="name" placeholder="Ex: Lucas Silva">
    </div>

    <div class="form-group">
      <label for="email">E-mail *</label>
      <input type="email" id="email" formControlName="email" placeholder="lucas@universidade.edu.br">
    </div>

    <div class="form-group">
      <label for="phone">Telefone (WhatsApp) *</label>
      <input type="text" id="phone" formControlName="phone" placeholder="24988887777">
    </div>

    <div class="form-group">
      <label for="cpf">CPF *</label>
      <input type="text" id="cpf" formControlName="cpf" placeholder="Apenas números">
    </div>

    <div class="form-group">
      <label for="certificates">Certificados / Formação</label>
      <textarea id="certificates" formControlName="certificates" rows="2" placeholder="Ex: Estudante de Agronomia - 5º Período"></textarea>
    </div>

    <div class="form-group">
      <label for="experience">Experiência Prévia</label>
      <textarea id="experience" formControlName="experience" rows="2" placeholder="Ex: Estágio básico em campo..."></textarea>
    </div>

    <button type="submit" [disabled]="workerForm.invalid">Cadastrar Perfil</button>
  </form>
</div>
